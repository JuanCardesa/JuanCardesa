<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Threat Intel Honeypot local lab flow</title>
  <desc id="desc">A playful dark laboratory diagram showing local Cowrie events being anonymized, mapped to ATT&amp;CK, and turned into a dashboard. The lab is not exposed to the Internet.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1000" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081522"/>
      <stop offset="1" stop-color="#0D2435"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7DD3FC" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1000" height="270" rx="20" fill="url(#background)"/>
  <rect width="1000" height="270" rx="20" fill="url(#dots)"/>
  <rect x="24" y="20" width="952" height="34" rx="9" fill="#102A40" stroke="#225676"/>
  <circle cx="44" cy="37" r="5" fill="#F59E0B"/>
  <text x="60" y="42" fill="#C7E7F5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">local-lab / experiment-03</text>
  <rect x="811" y="27" width="143" height="20" rx="10" fill="#33280F" stroke="#A86D0A"/>
  <text x="829" y="41" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1">NOT INTERNET-FACING</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="48" y="94" width="154" height="78" rx="14" fill="#102A40" stroke="#38BDF8"/>
    <text x="68" y="120" fill="#38BDF8" font-size="11">01 / SENSOR</text>
    <text x="68" y="146" fill="#F1F8FC" font-size="19" font-weight="700">Cowrie</text>
    <text x="68" y="161" fill="#7693A7" font-size="10">local events</text>

    <path d="M202 133h64" stroke="#38BDF8" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="m259 127 8 6-8 6" fill="none" stroke="#38BDF8" stroke-width="2"/>

    <rect x="268" y="94" width="174" height="78" rx="14" fill="#102A40" stroke="#22D3EE"/>
    <text x="288" y="120" fill="#22D3EE" font-size="11">02 / PIPELINE</text>
    <text x="288" y="144" fill="#F1F8FC" font-size="16" font-weight="700">parse + anonymize</text>
    <text x="288" y="161" fill="#7693A7" font-size="10">raw logs → safe data</text>

    <path d="M442 133h64" stroke="#22D3EE" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="m499 127 8 6-8 6" fill="none" stroke="#22D3EE" stroke-width="2"/>

    <rect x="508" y="94" width="174" height="78" rx="14" fill="#102A40" stroke="#38BDF8"/>
    <text x="528" y="120" fill="#38BDF8" font-size="11">03 / CONTEXT</text>
    <text x="528" y="144" fill="#F1F8FC" font-size="17" font-weight="700">map ATT&amp;CK</text>
    <text x="528" y="161" fill="#7693A7" font-size="10">heuristics + review</text>

    <path d="M682 133h64" stroke="#38BDF8" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="m739 127 8 6-8 6" fill="none" stroke="#38BDF8" stroke-width="2"/>

    <rect x="748" y="94" width="204" height="78" rx="14" fill="#12312E" stroke="#2DD4BF"/>
    <text x="768" y="120" fill="#2DD4BF" font-size="11">04 / OUTPUT</text>
    <text x="768" y="144" fill="#F1F8FC" font-size="17" font-weight="700">SQLite + dashboard</text>
    <text x="768" y="161" fill="#7693A7" font-size="10">structured findings</text>
  </g>

  <path d="M48 214h904" stroke="#225676"/>
  <text x="48" y="239" fill="#7693A7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1">STATUS: VALIDATED LOCALLY  •  REAL INTERNET DATA: NOT YET  •  SAFETY FIRST</text>
  <circle cx="931" cy="235" r="5" fill="#F59E0B"/>
</svg>
