<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Juan Cardesa profile header</title>
  <desc id="desc">Dark engineering-themed banner with Juan Cardesa's name, backend and application security tagline, and an abstract API analysis flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="1" stop-color="#0B1C2D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1024 176) rotate(180) scale(370 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D4FF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7DD3FC" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>
  <path d="M0 24C0 10.745 10.745 0 24 0h1232c13.255 0 24 10.745 24 24v5H0z" fill="#0D2136"/>
  <circle cx="25" cy="14.5" r="4" fill="#F59E0B"/>
  <circle cx="40" cy="14.5" r="4" fill="#38BDF8" fill-opacity="0.55"/>
  <circle cx="55" cy="14.5" r="4" fill="#22D3EE" fill-opacity="0.35"/>
  <text x="80" y="18.5" fill="#7892AA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.8">JUAN'S LITTLE CORNER OF GITHUB</text>

  <text x="72" y="92" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.2">HELLO, I'M JUAN — NICE TO MEET YOU</text>
  <rect x="72" y="110" width="48" height="3" rx="1.5" fill="#F59E0B"/>
  <text x="72" y="174" fill="#F3F8FC" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.8">Juan Cardesa</text>
  <text x="72" y="218" fill="#B7C8D8" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="450">Backend engineering with a security mindset.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.7">
    <rect x="72" y="259" width="160" height="34" rx="8" fill="#10283F" stroke="#1F6F99"/>
    <circle cx="91" cy="276" r="4" fill="#38BDF8"/>
    <text x="105" y="280" fill="#BFE9FA">PYTHON / FASTAPI</text>
    <rect x="244" y="259" width="165" height="34" rx="8" fill="#10283F" stroke="#1F6F99"/>
    <circle cx="263" cy="276" r="4" fill="#22D3EE"/>
    <text x="277" y="280" fill="#BFE9FA">JAVA / SPRING</text>
    <rect x="421" y="259" width="206" height="34" rx="8" fill="#10283F" stroke="#1F6F99"/>
    <circle cx="440" cy="276" r="4" fill="#F59E0B"/>
    <text x="454" y="280" fill="#BFE9FA">CURIOUS BY DEFAULT</text>
  </g>

  <g transform="translate(760 64)">
    <rect width="448" height="236" rx="16" fill="#081522" fill-opacity="0.86" stroke="#1E5374"/>
    <path d="M0 42h448" stroke="#1E5374"/>
    <circle cx="20" cy="21" r="4" fill="#22D3EE"/>
    <text x="34" y="25" fill="#7892AA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">juan@github:~</text>
    <text x="390" y="25" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">HI!</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="28" y="75" fill="#38BDF8" font-size="12">$ whoami</text>
      <text x="28" y="96" fill="#D7EDF7" font-size="13">backend builder + security-minded student</text>

      <text x="28" y="128" fill="#22D3EE" font-size="12">$ first_build</text>
      <text x="28" y="149" fill="#D7EDF7" font-size="13">my own PC, age 13 ✓</text>

      <text x="28" y="181" fill="#38BDF8" font-size="12">$ current_mode</text>
      <text x="28" y="202" fill="#D7EDF7" font-size="13">building useful things</text>
      <rect x="207" y="190" width="8" height="15" rx="1" fill="#F59E0B">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.25s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <text x="72" y="331" fill="#5F7990" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1">SEVILLE, SPAIN  /  BUILD • TEST • ASK WHY</text>
</svg>
